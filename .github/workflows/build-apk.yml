name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VERSION_RAW=$(java -version 2>&1)
          JAVA_MAJOR=$(echo "$JAVA_VERSION_RAW" | sed -nE 's/.*version "([0-9]+).*/\1/p' | head -n 1)

          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Unable to detect active Java major version."
            exit 1
          fi

          echo "Detected Java major version: $JAVA_MAJOR"

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi

          echo "Verified: Java major version is $JAVA_MAJOR (>= 17)."

      - name: Prepare Gradle project layout
        run: |
          echo "=== Preparing Gradle Project Layout ==="
          # Ensure app directory exists at repository root
          if [ ! -d "app" ] && [ -d "android/app" ]; then
            echo "Copying android/app to ./app..."
            cp -a android/app ./app
          fi

          # Ensure gradle directory exists at repository root
          if [ ! -d "gradle" ] && [ -d "android/gradle" ]; then
            echo "Copying android/gradle to ./gradle..."
            cp -a android/gradle ./gradle
          fi

          # Ensure settings.gradle.kts exists at repository root
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ] && [ -f "android/settings.gradle.kts" ]; then
            echo "Copying android/settings.gradle.kts to ./settings.gradle.kts..."
            cp -a android/settings.gradle.kts ./settings.gradle.kts
          fi

          # Ensure build.gradle.kts exists at repository root
          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ] && [ -f "android/build.gradle.kts" ]; then
            echo "Copying android/build.gradle.kts to ./build.gradle.kts..."
            cp -a android/build.gradle.kts ./build.gradle.kts
          fi

          # Ensure gradle.properties exists and has required flags for AGP 9.1.1
          if [ ! -f "gradle.properties" ]; then
            if [ -f "android/gradle.properties" ]; then
              echo "Copying android/gradle.properties to ./gradle.properties..."
              cp -a android/gradle.properties ./gradle.properties
            else
              echo "Creating gradle.properties..."
              {
                echo "android.builtInKotlin=false"
                echo "android.newDsl=false"
                echo "ksp.useKSP2=false"
                echo "android.useAndroidX=true"
                echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"
                echo "org.gradle.daemon=false"
                echo "org.gradle.parallel=true"
              } > gradle.properties
            fi
          fi

          if ! grep -q "android.builtInKotlin" gradle.properties; then
            echo "android.builtInKotlin=false" >> gradle.properties
          fi
          if ! grep -q "android.newDsl" gradle.properties; then
            echo "android.newDsl=false" >> gradle.properties
          fi
          if ! grep -q "ksp.useKSP2" gradle.properties; then
            echo "ksp.useKSP2=false" >> gradle.properties
          fi
          if ! grep -q "org.gradle.daemon" gradle.properties; then
            echo "org.gradle.daemon=false" >> gradle.properties
          fi
          mkdir -p android
          cp -f gradle.properties android/gradle.properties 2>/dev/null || true

          echo "Root layout verified:"
          ls -la

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK Platform and Build Tools
        run: |
          echo "=== Configuring Android SDK (API 35, Build-Tools 35.0.0) ==="
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: false

      - name: Ensure Gradle wrapper executable
        run: |
          echo "=== Verifying Gradle Wrapper ==="
          if [ ! -f "./gradlew" ]; then
            if [ -f "android/gradlew" ]; then
              cp -a android/gradlew ./gradlew
            else
              echo "Generating Gradle wrapper matching project distribution (Gradle 9.3.1)..."
              gradle wrapper --gradle-version 9.3.1
            fi
          fi
          chmod +x ./gradlew

      - name: Create temporary debug keystore
        run: |
          echo "=== Creating Temporary Debug Keystore ==="
          mkdir -p ~/.android
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Generating ./debug.keystore..."
            "$JAVA_HOME/bin/keytool" -genkey -v -keystore ./debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore does not exist after generation."
            exit 1
          fi

          cp -f ./debug.keystore ~/.android/debug.keystore || true
          mkdir -p app
          cp -f ./debug.keystore app/debug.keystore || true

          echo "Confirmed: ./debug.keystore exists."

      - name: Build debug APK
        run: |
          echo "=== Building Debug APK with Gradle wrapper ==="
          GRADLE_EXIT_CODE=0
          ./gradlew assembleDebug --stacktrace --no-daemon -Pandroid.builtInKotlin=false -Pandroid.newDsl=false -Pksp.useKSP2=false || GRADLE_EXIT_CODE=$?

          echo "Gradle process finished with exit code: $GRADLE_EXIT_CODE"
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$TARGET_APK" ]; then
            echo "Searching for generated APK in build directories..."
            FOUND_APK=$(find . -path "*/build/outputs/apk/debug/*.apk" -not -name "*unaligned*" 2>/dev/null | head -n 1)
            if [ -z "$FOUND_APK" ]; then
              FOUND_APK=$(find . -path "*/outputs/apk/*/*.apk" -not -name "*unaligned*" 2>/dev/null | head -n 1)
            fi
            if [ -n "$FOUND_APK" ] && [ -s "$FOUND_APK" ]; then
              echo "Found generated APK at $FOUND_APK. Syncing to $TARGET_APK..."
              mkdir -p app/build/outputs/apk/debug
              cp -f "$FOUND_APK" "$TARGET_APK"
            fi
          fi

          if [ -s "$TARGET_APK" ]; then
            echo "Success: Debug APK was built and verified at $TARGET_APK"
            ls -lh "$TARGET_APK"
            exit 0
          fi

          echo "Error: Debug APK was not generated at $TARGET_APK"
          if [ $GRADLE_EXIT_CODE -ne 0 ]; then
            echo "Gradle build failed with exit code $GRADLE_EXIT_CODE"
            exit $GRADLE_EXIT_CODE
          fi
          exit 1

      - name: Verify debug APK
        run: |
          echo "=== Verifying Debug APK ==="
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$TARGET_APK" ] && [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Found debug APK at android/app/build/outputs/apk/debug/app-debug.apk, copying to $TARGET_APK..."
            mkdir -p app/build/outputs/apk/debug
            cp -f "android/app/build/outputs/apk/debug/app-debug.apk" "$TARGET_APK"
          fi

          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Expected debug APK not found at $TARGET_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: $TARGET_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: $TARGET_APK is empty."
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *)
              echo "Error: $TARGET_APK does not have .apk extension."
              exit 1
              ;;
          esac

          if [ "$TARGET_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "Confirmed: $TARGET_APK exists and is a valid, non-empty debug APK."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          TEMP_DIR="${RUNNER_TEMP:-/tmp}/apk-release-asset"
          mkdir -p "$TEMP_DIR"

          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr -cs 'a-zA-Z0-9._-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty at $ASSET_PATH"
            exit 1
          fi

          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing APK to GitHub Releases ==="
          gh --version
          if ! command -v gh >/dev/null 2>&1; then
            echo "Error: GitHub CLI (gh) is not available."
            exit 1
          fi

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH does not exist."
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH is empty."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Release asset $ASSET_PATH does not have .apk extension."
              exit 1
              ;;
          esac

          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES="### Automated Debug APK Release
          - This is an automatically generated debug APK.
          - The APK was built by GitHub Actions.
          - GitHub Actions run number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit SHA: ${GITHUB_SHA}
          - The APK is intended for testing.
          - The APK is not a Play Store production release.
          - The APK is signed only with a temporary debug keystore."

          echo "Creating GitHub Release with tag: $TAG, title: $TITLE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading asset with --clobber..."
            gh release upload "$TAG" "$ASSET_PATH" --clobber
          else
            gh release create "$TAG" "$ASSET_PATH" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --latest
          fi

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Reporting APK Download Result ==="
          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release published successfully."
            RELEASE_INFO=$(gh release view "$TAG" --json tagName,title,url 2>/dev/null || true)
            RELEASE_URL=$(echo "$RELEASE_INFO" | jq -r '.url // empty' 2>/dev/null || true)
            if [ -z "$RELEASE_URL" ]; then
              RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            fi
            RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

            echo "Release Tag: $TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "✅ **Release Published Successfully!**"
              echo "- **Release Tag:** \`$TAG\`"
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **Direct Release Page:** [$RELEASE_URL]($RELEASE_URL)"
              echo "- **APK Asset Filename:** \`$ASSET_NAME\`"
              echo ""
              echo "📱 **Download on Phone:** You can download \`$ASSET_NAME\` directly from the **Assets** section of the [GitHub Release page]($RELEASE_URL) to install on your Android device."
              echo ""
              echo "📦 **Actions Artifact Backup:** The normal Actions artifact \`app-debug-apk\` is also preserved and available in the workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not complete."
            echo "APK build succeeded and the debug APK was created."
            echo "The Actions artifact named app-debug-apk remains available for download."

            {
              echo "## ⚠️ Debug APK Build Summary"
              echo ""
              echo "✅ **APK Build Succeeded:** The debug APK was compiled and verified successfully."
              echo "⚠️ **Release Publishing Warning:** GitHub Release publishing did not complete."
              echo "📦 **Download Artifact:** The Actions artifact named **\`app-debug-apk\`** remains available for download in the workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

